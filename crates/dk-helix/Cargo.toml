[package]
name        = "dk-helix"
version     = "0.3.0"
edition     = "2021"
license     = "MIT"
repository  = "https://github.com/dkod-io/dkod-engine"
description = "HelixDB-backed code-intelligence knowledge store for dkod-engine"

# This crate is NOT a member of the workspace because it requires a local
# HelixDB clone at ../../.helix/dev/helix-repo-copy/ (gitignored).
# Setup:
#   git clone https://github.com/HelixDB/helix-db \
#       .helix/dev/helix-repo-copy
#   cargo run --manifest-path crates/dk-helix/Cargo.toml

[[bin]]
name = "dk-helix"
path = "src/main.rs"

[dependencies]
# Local HelixDB build — see setup instructions above.
helix-db     = { path = "../../.helix/dev/helix-repo-copy/helix-db",     default-features = false, features = ["server"] }
helix-macros = { path = "../../.helix/dev/helix-repo-copy/helix-macros" }

# Runtime
tokio              = { version = "1",    features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3",  features = ["env-filter"] }
serde              = { version = "1",    features = ["derive"] }
serde_json         = "1"
chrono             = { version = "0.4",  features = ["serde"] }
uuid               = { version = "1",    features = ["v4", "serde"] }
async-trait        = "0.1"
anyhow             = "1"

# HelixDB ecosystem — versions pinned to match helix-db/Cargo.toml
bumpalo  = { version = "3",    features = ["collections", "boxed", "serde"] }
inventory = "0.3"
sonic-rs = "0.5"
dirs     = "5"
dotenvy  = "0.15"
